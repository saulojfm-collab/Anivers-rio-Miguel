services:
  - type: web
    name: copa-do-miguel
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: copa-miguel-db
          property: connectionString

databases:
  - name: copa-miguel-db
    plan: free
    databaseName: copa_miguel
    user: copa_miguel
